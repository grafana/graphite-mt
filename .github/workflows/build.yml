name: "build"

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

env:
  PROD_REGISTRY: "us-docker.pkg.dev/grafanalabs-global/docker-graphite-mt-prod"

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Generate docker tag and commit SHA
        run: |
          bash ./graphite/docker-tag.sh
          DOCKER_TAG=$(cat .docker_tag)
          echo "DOCKER_TAG=${DOCKER_TAG}" >> $GITHUB_ENV
          echo "Docker tag: $DOCKER_TAG"

      - name: Build image
        run: make build

      - name: Test image
        run: bash graphite/test.sh

      - name: Push image
        uses: grafana/shared-workflows/actions/docker-build-push-image@c66d74df41cf4ed28a90da1d91c263f9d1609a21 # docker-build-push-image/v0.3.4
        with:
          push: ${{ github.ref_name == 'master' }}
          registries: gar
          tags: |-
            ${{ env.DOCKER_TAG }}
          gar-image: "graphite-mt"
          context: "."
          file: "./Dockerfile"
          gar-environment: "prod"
